<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Dicee</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Indie+Flower|Lobster"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="entry" class="first container">
      <h1>Dice Game 🎲</h1>
      <button id="start-btn">Start</button>
    </div>
    
    <div hidden id="game" class="container">
      <h1 id="result">Refresh Me</h1>

      <div class="dice">
        <p>Player 1</p>
        <img id="dice-1" class="img1" src="images/dice6.png" />
      </div>

      <div class="dice">
        <p>Player 2</p>
        <img id="dice-2" class="img2" src="images/dice6.png" />
      </div>

      <br>
      <button id="reroll-btn">Reroll</button>
    </div>
    <script src="script.js"></script>
  </body>

  <footer>https://github.com/Gamferno/</footer>
</html>
